name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'android-project.tgz'
      - 'android-project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

env:
  VERSION_NAME: '1.43.1'
  VERSION_CODE: '147'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          mkdir -p "$HOME/sdk/build-tools" "$HOME/sdk/platforms"
          cd "$HOME/sdk"
          curl -sL -o bt.zip https://dl.google.com/android/repository/build-tools_r34-linux.zip
          curl -sL -o pl.zip https://dl.google.com/android/repository/platform-34-ext7_r03.zip
          unzip -q bt.zip
          unzip -q pl.zip
          mv android-14 build-tools/34.0.0
          mv android-34 platforms/android-34
          echo "ANDROID_HOME=$HOME/sdk" >> "$GITHUB_ENV"

      - name: Unpack the Android project
        run: |
          tar xzf android-project.tgz || unzip -q -o android-project.zip
          sed -i '/cloudflareinsights/d' index.html

      - name: Build and sign the APK
        id: build
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: bash android/build.sh

      - name: Upload the APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anime-partner-apk
          path: anime-partner*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish a Release with the APK
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.build.outputs.tag }}" anime-partner.apk \
            --title "${{ steps.build.outputs.title }}" --latest \
            --notes "Android APK, signed. Works offline after the first open. No account, no ads. Android 5.0 and newer. Developed by Shin." \
          || gh release upload "${{ steps.build.outputs.tag }}" anime-partner.apk --clobber
