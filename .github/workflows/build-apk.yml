name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'android-project.tgz'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

env:
  VERSION_NAME: '1.43'
  VERSION_CODE: '146'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager --install "build-tools;34.0.0" "platforms;android-34"

      - name: Unpack the Android project
        run: tar xzf android-project.tgz

      - name: Build and sign the APK
        id: build
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: bash android/build.sh

      - name: Upload the APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anime-partner-apk
          path: anime-partner*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish a Release with the APK
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.build.outputs.tag }}" anime-partner.apk \
            --title "${{ steps.build.outputs.title }}" --latest \
            --notes "Android APK, signed. Works offline after the first open. No account, no ads. Android 5.0 and newer. Installing over an older copy keeps your library, coins and streak. Developed by Shin." \
          || gh release upload "${{ steps.build.outputs.tag }}" anime-partner.apk --clobber
          
